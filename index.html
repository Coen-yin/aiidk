<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIIDK Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="appShell" class="app-shell">
      <section id="authView" class="auth-view">
        <div class="auth-card glass">
          <h1>AIIDK</h1>
          <p class="auth-subtitle">Custom AI workspace</p>

          <div class="auth-tabs">
            <button id="signInTab" class="active" type="button">Sign In</button>
            <button id="signUpTab" type="button">Sign Up</button>
          </div>

          <form id="authForm" class="auth-form">
            <label>
              Display name
              <input id="displayNameInput" name="displayName" type="text" placeholder="Jane Doe" />
            </label>
            <label>
              Email
              <input id="emailInput" name="email" type="email" required placeholder="you@example.com" />
            </label>
            <label>
              Password
              <input id="passwordInput" name="password" type="password" required minlength="6" placeholder="••••••••" />
            </label>
            <button id="authSubmit" type="submit">Sign In</button>
          </form>
        </div>
      </section>

      <section id="chatView" class="chat-view hidden" aria-hidden="true">
        <aside id="sidebar" class="sidebar glass">
          <div class="sidebar-header">
            <h2>Chats</h2>
            <button id="closeSidebarBtn" class="icon-btn mobile-only" type="button" aria-label="Close menu">✕</button>
          </div>
          <button id="newChatBtn" class="primary-btn" type="button">+ New Chat</button>
          <div id="chatListSkeleton" class="skeleton-list" aria-hidden="true"></div>
          <ul id="chatList" class="chat-list"></ul>
        </aside>

        <div id="sidebarOverlay" class="sidebar-overlay"></div>

        <main class="chat-main">
          <header class="chat-header glass">
            <div class="chat-header-left">
              <button id="menuBtn" class="icon-btn" type="button" aria-label="Open menu">☰</button>
              <h3 id="chatTitle">New Chat</h3>
            </div>
            <div class="chat-header-right">
              <button id="editProfileBtn" class="ghost-btn" type="button">Edit Profile</button>
              <span id="userBadge" class="user-badge"></span>
              <button id="logoutBtn" class="ghost-btn" type="button">Sign Out</button>
            </div>
          </header>

          <section id="messagesContainer" class="messages-container">
            <div id="messagesSkeleton" class="messages-skeleton" aria-hidden="true"></div>
            <div id="messagesList" class="messages-list"></div>
          </section>

          <form id="composerForm" class="composer glass">
            <textarea
              id="messageInput"
              rows="1"
              placeholder="Ask anything..."
              maxlength="8000"
            ></textarea>
            <button id="sendBtn" type="submit" class="primary-btn">Send</button>
          </form>
        </main>
      </section>

      <div id="toastContainer" class="toast-container" aria-live="polite"></div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
